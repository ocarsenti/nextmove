[pytest]
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
addopts =
    --cov=engine
    --cov=ontology
    --cov=questionnaire
    --cov=api
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=75
markers =
    integration: end-to-end tests across multiple modules
    api: tests that exercise the FastAPI layer via TestClient
    golden: fixed-input/fixed-output regression tests guarding against silent scoring drift
